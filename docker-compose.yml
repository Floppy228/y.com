services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: y_com
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: y_com_production
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  app:
    build: .
    ports:
      - "80:80"
    environment:
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      Y_COM_DATABASE_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
    depends_on:
      - db
    restart: always

volumes:
  pgdata:
